name: Deploy Pulsewatch site and docs

on:
  push:
    branches:
      - main
    paths:
      - "apps/docs/**"
      - "apps/landing/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/configure-pages@v5
      - run: pnpm install --filter landing --filter docs --frozen-lockfile
      - run: pnpm --dir apps/landing build
      - run: pnpm --dir apps/docs build
      - name: Assemble Pages site
        run: |
          mkdir -p site/docs
          cp -R apps/landing/dist/. site/
          cp -R apps/docs/build/. site/docs/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
